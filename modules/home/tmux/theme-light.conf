# Alt-d changes sessions internally; keep its visible mode labels fixed-width.
set -g status-left ' #{?client_prefix,^ ,}#[fg=#626B5E]#(~/.local/bin/tmux/client-origin.sh #{client_pid})#[fg=#626B5E,bg=default]#{?@paired-terminal,#[fg=#7E5F0E]T:#{@workbench-session},#{?@task-root,#[fg=#36703A]#[bold]A:#S#[nobold],#[fg=#36703A]#[bold]#S#[nobold]}}#[fg=#626B5E,bg=default] #[fg=#4A5548,bg=default]#{=/-28/…:#{s|^/home/[^/]+|~|:pane_current_path}} '

# set -g status-right "#[fg=#4A5548,bg=default,bold]#{?window_zoomed_flag,+, }#[fg=#2A6E99] #(duo status)#(cpu) #[fg=#2A6E99]#(memory) #[bg=default]#(battery) #[fg=#2A3329,nobold]%H:%M"
set -g status-right '#(TMUX_WORKBENCH_SESSION="#{session_name}" ~/.local/bin/tmux/workbench.sh status-sync)#[fg=#4A5548,bg=default,bold]#{?window_zoomed_flag,+, } #[fg=#626B5E]#(~/.local/bin/scripts/statusbar/cpu) #(~/.local/bin/tmux/server-sensors.sh)#[fg=#626B5E]#(~/.local/bin/scripts/statusbar/memory) #[bg=default]#(~/.local/bin/scripts/statusbar/battery)#(~/.local/bin/tmux/battery-time.sh) #[fg=#2A3329,nobold]%H:%M'
set -g status-right-style 'fg=#4A5548,bg=default'
# Numbers: green = no action needed, cyan = working, orange = needs input,
# red = failed/canceled, gray = manually idle (Alt-Shift-I).
# The manual tag wins over agent states; known states win over stale bells.
set -g @workbench-agent-window-number-style '#{?@agent-manual-idle,fg=#626B5E,#{?#{||:#{==:#{@agent-state},waiting},#{==:#{@agent-state},needs-input}},fg=#7E5F0E,#{?#{||:#{==:#{@agent-state},blocked},#{==:#{@agent-state},error}},fg=#B03E45,#{?#{||:#{==:#{@agent-state},running},#{==:#{@agent-state},busy}},fg=#2A6E99,#{?#{||:#{==:#{@agent-state},done},#{||:#{==:#{@agent-state},idle},#{==:#{@agent-state},ready}}},fg=#36703A,#{?window_bell_flag,fg=#7E5F0E,fg=#36703A}}}}}}'
set -g @workbench-agent-window-current-number-style '#{E:@workbench-agent-window-number-style}'
set -g window-status-current-style 'fg=#36703A,bg=default,bold'
set -g window-status-format '#[#{E:@workbench-agent-window-number-style},bg=default,#{?#{@agent-home-session},underscore,nounderscore}]#I#[#{E:@workbench-agent-window-number-style},bg=default,nounderscore]: #[fg=#626B5E,bg=default,bold,nounderscore]#W#[fg=#EEF0E4,bg=default,nounderscore] '
set -g window-status-current-format '#[#{E:@workbench-agent-window-current-number-style},bg=default,bold,#{?#{@agent-home-session},underscore,nounderscore}]#I#[#{E:@workbench-agent-window-current-number-style},bg=default,bold,nounderscore]: #[fg=#2A3329,bg=default,bold,nounderscore]#W#[fg=#E5E9DA,bg=default,nounderscore] '
set -g window-status-last-style 'fg=#626B5E,bg=default'
set -g window-status-activity-style 'fg=#2A6E99,bg=default'
set -g window-status-bell-style 'fg=#7E5F0E,bg=default'
set -g pane-border-style 'fg=#B9C2AE'  # visible, so the active border's junction ticks don't look like stray stubs
set -g pane-active-border-style 'fg=#36703A'
set -g message-command-style "bg=default,fg=#626B5E"
set -g message-style "bg=default,fg=#626B5E"
set -g mode-style "bg=#D8E2CC,fg=#4A5548"
