# Alt-d changes sessions internally; keep its visible mode labels fixed-width.
set -g status-left ' #{?client_prefix,^ ,}#[fg=#868db0]#(~/.local/bin/tmux/client-origin.sh #{client_pid})#[fg=#1e2233,bg=default]#{?@paired-terminal,#[fg=#e6c27a]T:#{@workbench-session},#{?@task-root,#[fg=#b4befe]#[bold]A:#S#[nobold],#[fg=#b4befe]#[bold]#S#[nobold]}}#[fg=#1e2233,bg=default] #[fg=#adb1c7,bg=default]#{=/-28/…:#{s|^/home/[^/]+|~|:pane_current_path}} '

set -g status-right '#(TMUX_WORKBENCH_SESSION="#{session_name}" ~/.local/bin/tmux/workbench.sh status-sync)#[fg=#77bdfb,bg=default,bold]#{?window_zoomed_flag,+, } #[fg=#868db0,nobold]#(~/.local/bin/scripts/statusbar/cpu) #[fg=#868db0]#(~/.local/bin/scripts/statusbar/memory) #[bg=default]#(~/.local/bin/scripts/statusbar/battery)#(~/.local/bin/tmux/battery-time.sh) #[fg=#d4d2e2,nobold]%H:%M'
# set -g status-right '#[fg=#77bdfb,bg=default,bold]#{?window_zoomed_flag,+, }#[fg=#b4befe,nobold] #(duo status)#(cpu) #[fg=#b4befe]#(memory) #[bg=default]#(battery) #[fg=#d4d2e2,nobold]%H:%M'
# set -g status-right '#[fg=#77bdfb,bg=default,bold]#{?window_zoomed_flag,+, }#[fg=#d4d2e2,nobold]%H:%M #[bg=default]'
# set -g status-right '#[fg=#77bdfb,bg=default,bold]#{?window_zoomed_flag,+, }#[fg=#b4befe,bold]#[nobold] #[nobold]#(duo status)#(cpu) #(memory) #[bg=default]#(battery) #[fg=#adb1c7,bg=default,nobold,noitalics]#(forecast) #[fg=#d4d2e2,nobold]%H:%M #[bg=default]'
# set -g status-right '#[fg=#77bdfb,bg=default,bold]#{?window_zoomed_flag,+, }#[fg=#b4befe,bold]#[nobold] #[nobold]#(duo status)#(cpu) #(memory) #[bg=default]#(battery) #[fg=#adb1c7,bg=default,nobold,noitalics]#(forecast) #[fg=#d4d2e2,nobold]%H:%M #[bg=default]'
# Numbers: green = no action needed, cyan = working, orange = needs input,
# red = failed/canceled, gray = manually idle (Alt-Shift-I).
# The manual tag wins over agent states; known states win over stale bells.
set -g @workbench-agent-window-number-style '#{?@agent-manual-idle,fg=#868db0,#{?#{||:#{==:#{@agent-state},waiting},#{==:#{@agent-state},needs-input}},fg=#e6c27a,#{?#{||:#{==:#{@agent-state},blocked},#{==:#{@agent-state},error}},fg=#e38b96,#{?#{||:#{==:#{@agent-state},running},#{==:#{@agent-state},busy}},fg=#8fd3e6,#{?#{||:#{==:#{@agent-state},done},#{||:#{==:#{@agent-state},idle},#{==:#{@agent-state},ready}}},fg=#a3c88b,#{?window_bell_flag,fg=#e6c27a,fg=#a3c88b}}}}}}'
set -g @workbench-agent-window-current-number-style '#{E:@workbench-agent-window-number-style}'
set -g window-status-current-style 'fg=#b4befe,bg=default'
set -g window-status-format '#[#{E:@workbench-agent-window-number-style},bg=default,italics,#{?#{@agent-home-session},underscore,nounderscore}]#I#[#{E:@workbench-agent-window-number-style},bg=default,italics,nounderscore]: #[fg=#868db0,bg=default,noitalics,bold,nounderscore]#W#[fg=#1e2233,bg=default,nounderscore] '
set -g window-status-current-format '#[#{E:@workbench-agent-window-current-number-style},bg=default,italics,#{?#{@agent-home-session},underscore,nounderscore}]#I#[#{E:@workbench-agent-window-current-number-style},bg=default,italics,nounderscore]: #[fg=#d4d2e2,bg=default,bold,noitalics,nounderscore]#W#[fg=#1e2233,bg=default,nounderscore] '
set -g window-status-last-style 'fg=#a9b1d6,bg=default'
set -g window-status-activity-style 'fg=#8fd3e6,bg=default'
set -g window-status-bell-style 'fg=#e6c27a,bg=default'
set -g pane-border-style 'fg=#414868'  # visible, so the active border's junction ticks don't look like stray stubs
set -g pane-active-border-style 'fg=#b4befe'
set -g message-command-style "bg=default,fg=#d4d2e2"
set -g message-style "bg=default,fg=#d4d2e2"
set -g mode-style "bg=#3c4e64,fg=#e6e4f0"
