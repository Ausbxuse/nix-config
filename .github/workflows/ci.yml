name: CI

on:
  push:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      NIX_OVERRIDES: >-
        --no-update-lock-file
        --no-write-lock-file
        --override-input nix-secrets path:./.ci/nix-secrets
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          install_url: https://releases.nixos.org/nix/nix-2.31.3/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Print Nix version
        run: nix --version

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          sudo apt-get clean

      - name: Eval flake outputs
        run: |
          nix flake show --all-systems $NIX_OVERRIDES
          nix eval .#packages.x86_64-linux --apply builtins.attrNames $NIX_OVERRIDES >/dev/null
          nix eval .#packages.aarch64-linux --apply builtins.attrNames $NIX_OVERRIDES >/dev/null
          nix eval .#checks.x86_64-linux --apply builtins.attrNames $NIX_OVERRIDES >/dev/null
          nix eval .#checks.aarch64-linux --apply builtins.attrNames $NIX_OVERRIDES >/dev/null

      - name: Build representative checks
        run: |
          nix build \
            .#checks.x86_64-linux.shellcheck \
            .#checks.x86_64-linux.nvim \
            .#checks.x86_64-linux.custom-home-install \
            .#checks.x86_64-linux.agent-hub-conversations \
            --no-link \
            $NIX_OVERRIDES
