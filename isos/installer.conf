# nix-config installer settings
#
# Edit values after the '=' and save. Lines beginning with '#' are comments.
# Values are literal data: do not add shell quotes, `export`, or inline comments.
# Blank advanced values inherit the selected host profile's baked default.
#
# The ISO contains two complete x86_64 offline targets:
#
#   razy   NVIDIA laptop; portable-nvidia-gnome + personal-gnome,
#          laptop-2_5k display profile, encrypted Btrfs, 31G swap.
#          This is the public pre-enrollment configuration. NVIDIA stays in
#          PRIME offload mode; selecting Razy does not enable sync mode.
#
#   spacy  Intel-only Lenovo Yoga 720; portable-gnome + minimal-gui,
#          gnome-default display profile, encrypted Btrfs, 15G swap.
#          No NVIDIA module or NVIDIA packages are enabled.
#
# Offline targets are exact snapshots. The disk and installer-only behavior
# can change offline, but identity, system/Home profiles, layout, and swap size
# are part of the baked system. Set install_source=online before overriding a
# baked value. Rebuild the ISO to change what is available fully offline.

# Profile to install: auto | razy | spacy
# auto selects Razy when an NVIDIA display controller is detected; otherwise
# it selects Spacy. The launcher always asks you to affirm the selection.
install_profile=auto

# Package source: auto | offline | online
# auto uses an embedded target when present. On this ISO that means a fully
# offline Razy or Spacy install. online evaluates/builds through Nix normally.
install_source=auto

# Open this file before the launcher continues: ask | yes | no
# The editor uses the repository's Neovim options, keymaps, and autocmds in an
# offline-safe mode. Plugin downloads are intentionally disabled on the ISO.
# While setup waits for input, compressed ISO data is prefetched into reclaimable
# RAM (at most half of available memory). It stops before disk installation.
# For timing comparisons, launch with NIXOS_INSTALLER_PREFETCH=0 to disable it.
edit_before_install=ask

# Target disk: auto | prompt | /dev/<whole-disk>
# auto starts with the host default (/dev/nvme0n1) and prompts if unavailable.
# prompt always shows detected non-removable disks. A /dev path is strict.
disk=auto

# Copy the adjusted public repository into the installed user's home: yes | no | ask
# The default is yes and does not prompt. Set no to opt out, or ask to restore
# the confirmation prompt.
copy_repo=yes

# Optional absolute destination for that copy. Blank uses
# /mnt/home/<username>/src/public/nix-config for a NixOS install.
repo_dest=

# Reuse an already partitioned and mounted target at /mnt: yes | no
# yes skips Disko. The required filesystems must already be mounted correctly.
skip_partitioning=no

# Print the resolved plan without changing disks or installing: yes | no
dry_run=no

# ANSI color output: yes | no
color=yes

# Accept the installer's normal confirmation prompts: yes | no
# WARNING: yes also accepts the destructive disk wipe. The separate profile
# affirmation in the launcher is still shown.
assume_yes=no

# ---------------------------------------------------------------------------
# Advanced overrides. Leave these blank/auto for the selected baked profile.
# On a fully offline install, changing a baked value is rejected with a clear
# message. Use install_source=online if you intentionally need an override.

# Nix system: blank | x86_64-linux | aarch64-linux
# This ISO and both embedded targets are x86_64-linux only.
system=

# Login user (Linux username rules). Offline Razy/Spacy value: zhenyu
username=

# Git identity. Spaces are allowed; quotes are not needed.
name=
email=

# Install modes: auto | yes | no
# Embedded targets require nixos=yes and their baked Home Manager setting.
nixos=auto
home=auto

# NixOS profile: blank | minimal | minimal-gui | nvidia-laptop |
# portable-gnome | portable-nvidia-gnome
nixos_profile=

# Home Manager profile: blank | minimal | minimal-gui | personal-gnome
home_profile=

# Display profile: blank | none | gnome-default | laptop-2_5k | external-4k |
# docked-dual
display_profile=

# Disk layout: blank | luks-btrfs | plain-btrfs
install_layout=

# Swapfile size: blank or an integer with optional K/M/G suffix, for example
# 512M, 15G, or 31G.
swap_size=

# Generic-Linux Caps Lock remap: ask | yes | no
# This is ignored when installing a complete NixOS target.
caps_remap=ask

# nix-portable Home-only mode for a non-NixOS host: yes | no
# This needs install_source=online and is not a complete NixOS install.
portable=no

# Equivalent terminal commands available on the ISO:
#   install-profile       auto-detect, optionally edit this file, then install
#   edit-install-config   edit this file only
#   install-razy          choose the baked Razy target and ask for affirmation
#   install-spacy         choose the baked Spacy target and ask for affirmation
#   install-interactive   run the original fully interactive install-config UI
#   install-config --help show every low-level command-line option
